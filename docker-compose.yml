services:
  # 1. Unlimited Neo4j 5 Community (Zero Auto-Pause, Low RAM Footprint)
  neo4j:
    image: neo4j:5-community
    container_name: jarvis-neo4j
    restart: always
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-JarvisGraph2026!}
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - ./data/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 2. Headless Wine MetaTrader 5 + mt5linux RPyC Server (x86_64)
  mt5-wine:
    image: gmag11/metatrader5_vnc:latest
    container_name: jarvis-mt5
    restart: always
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    ports:
      - "127.0.0.1:3000:3000"   # Web VNC to log into FTMO MT5 once via browser
      - "127.0.0.1:8001:8001"   # RPyC bridge port for mt5linux
    environment:
      - CUSTOM_USER=${VNC_USER:-admin}
      - PASSWORD=${VNC_PASSWORD:-ftmo24x7}
      - WINEDLLOVERRIDES=mscoree=
    volumes:
      - ./data/mt5-wine:/config

  # 3. AVI / Jarvis Cortex + Swarm + 06:00 AM IST Session Governor
  jarvis-core:
    build:
      context: .
      dockerfile: Dockerfile.linux
    container_name: jarvis-core
    restart: always
    depends_on:
      neo4j:
        condition: service_healthy
      mt5-wine:
        condition: service_started
    ports:
      - "127.0.0.1:8888:8888"   # Alpha Observatory UI (Change-locked to localhost via SSH tunnel)
    environment:
      - TZ=Asia/Kolkata         # Guarantees exact 06:00:00 AM IST cutoff!
      - LOCAL_NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-JarvisGraph2026!}
      - MT5_BRIDGE_HOST=mt5-wine
      - MT5_BRIDGE_PORT=8001
      - REPORTS_DIR=/app/reports
    volumes:
      - ./reports:/app/reports
      - ./November:/app/November

